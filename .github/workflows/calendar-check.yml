# Weekly self-check of the Vaishnava calendar data.
# 1) Rebuilds the data from the NEWEST release of the open-source "gaurabda" (GCAL) package.
# 2) Runs the data checks (internal consistency + the days copied from the Nairobi wall calendar).
# 3) If the new data differs from what the site has: opens a pull request with the update (never changes the site by itself).
#    If the new data FAILS the checks: opens an issue instead, and the site keeps its current data.
name: calendar-check
on:
  schedule:
    - cron: "17 5 * * 1"      # every Monday, 08:17 Nairobi time
  workflow_dispatch: {}
  push:
    paths: ["calendar-data/**", "iskcon-juja-project/tools/**"]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check the data we already have
        run: python3 iskcon-juja-project/tools/check_gaurabda_data.py
      - name: Rebuild from the newest upstream engine
        if: github.event_name != 'push'
        run: |
          pip install --upgrade gaurabda
          echo "ENGINE=$(pip show gaurabda | grep ^Version | cut -d' ' -f2)" >> $GITHUB_ENV
          mkdir -p /tmp/newdata
          GAURABDA_ENGINE=pip GAURABDA_OUT=/tmp/newdata python3 -I iskcon-juja-project/tools/build_gaurabda_data.py 1900 2070
      - name: Compare and report
        if: github.event_name != 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if GAURABDA_OUT=/tmp/newdata python3 iskcon-juja-project/tools/check_gaurabda_data.py > /tmp/check.txt 2>&1; then OK=1; else OK=0; fi
          cat /tmp/check.txt
          if [ "$OK" = "0" ]; then
            gh issue create --title "Calendar check FAILED with gaurabda $ENGINE" --body "The newest engine release gives data that fails our checks. The site keeps its current data. Details: $(head -c 3000 /tmp/check.txt)" || true
            exit 0
          fi
          if diff -rq calendar-data /tmp/newdata --exclude=manifest.json > /tmp/diff.txt 2>&1; then echo "No changes upstream."; exit 0; fi
          git config user.name "calendar-bot"; git config user.email "calendar-bot@users.noreply.github.com"
          git checkout -b calendar-update-$(date +%Y%m%d)
          cp /tmp/newdata/*.json calendar-data/
          python3 iskcon-juja-project/tools/check_gaurabda_data.py --manifest
          git add calendar-data && git commit -m "Calendar data updated from gaurabda $ENGINE [skip ci]"
          git push -u origin HEAD
          gh pr create --title "Calendar data update (gaurabda $ENGINE)" --body "The upstream engine now gives different results. All data checks pass on the new data. Changed files: $(head -c 2000 /tmp/diff.txt)"
